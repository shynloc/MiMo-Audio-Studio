services:
  postgres:
    image: postgres:17-alpine
    container_name: ${POSTGRES_CONTAINER_NAME:-mimo-studio-postgres}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mimo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-mimo_audio}
    volumes:
      - ${APP_DATA_DIR:-/opt/mimo-studio/data/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  api:
    image: ${API_IMAGE_REPO:-audioplayer-api}:${AUDIOPLAYER_RELEASE:-local}
    container_name: ${API_CONTAINER_NAME:-mimo-studio-api}
    env_file: ${APP_ENV_FILE:-/opt/mimo-studio/.env}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8787}:8787"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8787${API_HEALTH_PATH:-/audioplayer/api/health}"]
      interval: 10s
      timeout: 4s
      retries: 10

  web:
    image: ${WEB_IMAGE_REPO:-audioplayer-web}:${AUDIOPLAYER_RELEASE:-local}
    container_name: ${WEB_CONTAINER_NAME:-mimo-studio-web}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-5689}:80"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m,mode=0755
      - /var/run:size=1m,mode=0755
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 4s
      retries: 10
